<!doctype html>
<html>
  <head>
    <title>Sentinel Tickets</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    />
  </head>

  <body>
    <main class="container">
      <h1>Sentinel Tickets</h1>
      <h4>Sentinel Tickets support official site</h4>
      <div class="grid">
        <article>
          <h2>Sign in</h2>
          <form id="signin-form">
            <input type="text" id="signin-username" placeholder="username" />
            <input
              type="password"
              id="signin-password"
              placeholder="password"
            />
            <button type="submit">Sign in</button>
          </form>
        </article>
        <article>
          <h2>Sign up</h2>
          <form id="signup-form">
            <input type="text" id="signup-username" placeholder="username" />
            <input
              type="password"
              id="signup-password"
              placeholder="password"
            />
            <button type="submit">Sign up</button>
          </form>
        </article>
      </div>
      <p id="message"></p>
    </main>

    <script src="./app.js"></script>
  </body>
</html>
